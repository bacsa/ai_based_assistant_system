<title>Assistant Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed left rail of sections; each section is a working surface built from list + detail splits.
   Semantic colour (ok / warn / crit / info) marks state only; the accent is reserved for actions and selection. */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --panel-2:#e9ece7; --line:#d3d8d1; --fg:#1a221e; --muted:#5b6660;
  --accent:#1e6b74; --accent-ink:#ffffff; --accent-soft:#d9eaec;
  --ok:#2d7a4e; --warn:#a9680c; --crit:#b23a2d; --info:#3a5c9f;
  --ok-soft:#dff0e5; --warn-soft:#f6ead4; --crit-soft:#f6dedb; --info-soft:#e0e7f5;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --panel:#1a211e; --panel-2:#222b27; --line:#2f3a35; --fg:#e4e9e6; --muted:#94a19a;
    --accent:#64b7bf; --accent-ink:#0e1a1c; --accent-soft:#1c3337;
    --ok:#6fc28f; --warn:#e2a64c; --crit:#e67c70; --info:#8aa6e3;
    --ok-soft:#1b3326; --warn-soft:#3a2c13; --crit-soft:#3c1f1b; --info-soft:#1f2a42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a211e; --panel-2:#222b27; --line:#2f3a35; --fg:#e4e9e6; --muted:#94a19a;
  --accent:#64b7bf; --accent-ink:#0e1a1c; --accent-soft:#1c3337;
  --ok:#6fc28f; --warn:#e2a64c; --crit:#e67c70; --info:#8aa6e3;
  --ok-soft:#1b3326; --warn-soft:#3a2c13; --crit-soft:#3c1f1b; --info-soft:#1f2a42;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
code,pre,.mono{font-family:var(--font-mono);font-size:12.5px}
pre{margin:0;white-space:pre-wrap;word-break:break-word}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.nav{background:var(--panel);border-right:1px solid var(--line);padding-block:18px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--radius);color:var(--fg)}
.nav button:hover{background:var(--panel-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .count{font-size:11px;background:var(--panel-2);color:var(--muted);padding:1px 7px;border-radius:999px;min-width:20px;text-align:center}
.nav button.on .count{background:var(--panel);color:var(--accent)}
.nav .grow{flex:1}
.nav .foot{border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.nav .foot .lnk{all:unset;cursor:pointer;color:var(--accent);padding:2px 0}
.nav .foot .lnk:focus-visible{outline:2px solid var(--accent)}

.main{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.page-h p{color:var(--muted);max-width:68ch;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{background:var(--panel-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.55;cursor:default}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.warn .val{color:var(--warn)} .tile.crit .val{color:var(--crit)} .tile.ok .val{color:var(--ok)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.split{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.6fr);gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>.ph h2,.panel>.ph h3{font-size:13.5px}
.panel>.pb{padding:14px}
.panel>.pb.tight{padding:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12px;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.tw{overflow-x:auto;min-width:0}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nowrap{white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--panel-2);color:var(--muted);border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.flat::before{display:none}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted);font-size:11.5px;font-family:var(--font-mono)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel-2)}
.item.sel{background:var(--accent-soft)}
.item .stripe{width:4px;height:100%;min-height:28px;border-radius:2px;background:var(--line)}
.item .stripe.high,.item .stripe.critical{background:var(--crit)} .item .stripe.medium{background:var(--warn)} .item .stripe.low{background:var(--info)}
.item b{display:block;font-weight:500}
.item .meta{font-size:12px;color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:7px 9px;min-width:0;width:100%}
.field textarea{min-height:120px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field .range{display:flex;gap:10px;align-items:center}
.field .range input{padding:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}

.yaml{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;overflow-x:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-word}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

.trace{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:11.5px;font-weight:500;color:var(--muted)}
.step .n.ok{background:var(--ok-soft);color:var(--ok)} .step .n.act{background:var(--warn-soft);color:var(--warn)}
.step .call{font-family:var(--font-mono);font-size:12.5px;word-break:break-word}
.step .res{font-size:13px;margin-top:3px}
.step .note{font-size:12.5px;color:var(--muted);margin-top:2px}

.msg{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--bg)}
.msg .from{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}

.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:14px}
.bub{max-width:min(60ch,92%);padding:9px 12px;border-radius:10px;background:var(--panel-2)}
.bub.me{align-self:flex-end;background:var(--accent-soft)}
.bub .src{margin-top:6px;font-size:12px;color:var(--muted)}
.chat-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-in input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:8px 10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.chip:hover{background:var(--panel-2)}
.chip:focus-visible{outline:2px solid var(--accent)}

.hit{padding:10px 0;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:0}
.hit .t{font-weight:500}
.hit mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:2px}
.hit .path{font-size:12px;color:var(--muted)}
.score{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}

.pipe{display:flex;flex-wrap:wrap;gap:6px}
.pipe span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pipe span.done{background:var(--ok-soft);color:var(--ok)}
.pipe span.run{background:var(--accent-soft);color:var(--accent)}

.appr{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.appr.done{border-left-color:var(--ok)} .appr.rej{border-left-color:var(--crit)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:50;max-width:min(90vw,60ch);box-shadow:0 6px 20px rgba(0,0,0,.18)}

.canvas-wrap{overflow:auto;background:
  linear-gradient(var(--line) 1px, transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/24px 24px, var(--bg);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-height:520px;touch-action:none}
.canvas-wrap svg{display:block}
.canvas-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px}
.node{cursor:grab}
.node .nbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.node.sel .nbox{stroke:var(--accent);stroke-width:2}
.node .ntitle{font:500 12.5px var(--font-ui);fill:var(--fg)}
.node .nsub{font:11px var(--font-mono);fill:var(--muted)}
.node .port{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.node .nbadge{fill:var(--panel-2)} .node .nbadge-t{font:500 10.5px var(--font-mono);fill:var(--muted)}
.node .ndot.ok{fill:var(--ok)} .node .ndot.failed{fill:var(--crit)} .node .ndot.waiting{fill:var(--warn)}
.nt-trigger .nstripe{fill:var(--accent)} .nt-filter .nstripe{fill:var(--warn)} .nt-tool .nstripe{fill:var(--info)}
.nt-agent .nstripe{fill:#7a5fb5} .nt-approval .nstripe{fill:var(--crit)} .nt-notify .nstripe{fill:var(--ok)}
.nt-wait .nstripe{fill:var(--muted)} .nt-end .nstripe{fill:var(--line)}
.node.st-ok .nbox{stroke:var(--ok)} .node.st-failed .nbox{stroke:var(--crit);stroke-width:2} .node.st-waiting .nbox{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}
.edge .ehit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge .eline{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.7}
.edge.taken .eline{stroke:var(--accent);stroke-width:2.2;opacity:1}
.edge.sel .eline{stroke:var(--crit)}
.edge .elabel{font:10.5px var(--font-mono);fill:var(--muted)}
.ticks{display:flex;gap:2px;margin:6px 0 2px;min-height:12px}
.ticks i{display:inline-block;width:8px;height:12px;border-radius:2px;background:var(--line)}
.ticks i.success{background:var(--ok)} .ticks i.failed{background:var(--crit)} .ticks i.waiting{background:var(--warn)} .ticks i.running{background:var(--info)}
.fcard:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .edge.taken .eline{stroke-dasharray:6 4;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .node.pulse .nbox{animation:pulse 1.2s ease-out}
  @keyframes pulse{0%{stroke:var(--accent);stroke-width:4}100%{stroke-width:1.2}}
}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center}
  .brand{margin:0 8px 0 0} .brand small{display:none} .brand b{white-space:nowrap;font-size:13px}
  .nav button{white-space:nowrap;padding:6px 10px} .nav .grow,.nav .foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .split{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .btn,.nav button{transition:background .12s} }
</style>

<div class="app">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
/* ============================================================
   Assistant Control Room – prototype.
   Everything runs in the browser against demo data. The engines below
   (knowledge search, rule evaluation, policy decisions, tool mocks) are
   small but real, so the console can be exercised end to end.
   ============================================================ */

// ---------- utilities
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = new Date(); today.setHours(0, 0, 0, 0);
const TODAY = fmtDate(today);
const dayStr = n => fmtDate(addDays(today, n));
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const median = arr => { const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const pct = r => r == null ? '–' : Math.round(r * 100) + ' %';
const nowStr = () => { const d = new Date(); return `${fmtDate(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const uid = (p = 'id') => p + '-' + Math.random().toString(36).slice(2, 8);
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }

function yamlLines(v, ind) {
  const pad = '  '.repeat(ind); const out = [];
  const isObj = x => x && typeof x === 'object';
  const scalar = x => (typeof x === 'string' && (/[:#{}\[\],]|^\s|\s$|^$/.test(x) || /^\d/.test(x) === false && /^(true|false|null|yes|no)$/i.test(x))) ? JSON.stringify(x) : String(x);
  if (Array.isArray(v)) {
    for (const x of v) {
      if (isObj(x)) { const sub = yamlLines(x, ind + 1); out.push(pad + '- ' + sub[0].trim()); out.push(...sub.slice(1)); }
      else out.push(pad + '- ' + scalar(x));
    }
  } else if (isObj(v)) {
    for (const [k, x] of Object.entries(v)) {
      if (x === undefined) continue;
      if (isObj(x) && (Array.isArray(x) ? x.length : Object.keys(x).length)) { out.push(pad + k + ':'); out.push(...yamlLines(x, ind + 1)); }
      else out.push(pad + k + ': ' + (isObj(x) ? (Array.isArray(x) ? '[]' : '{}') : scalar(x)));
    }
  }
  return out;
}
const toYaml = v => yamlLines(v, 0).join('\n');

// ---------- demo data
const KEY_PAGES = ['/pricing', '/', '/blog/seo-checklist', '/product/erp'];
const ALL_PAGES = [...KEY_PAGES, '/contact'];
const PAGE_BASE = { '/pricing': [180, 5200], '/': [420, 15000], '/blog/seo-checklist': [260, 9000], '/product/erp': [95, 3100], '/contact': [60, 1400] };

function genMetrics() {
  const m = {}; let seed = 7;
  for (const [page, [c, i]] of Object.entries(PAGE_BASE)) {
    const rnd = mulberry32(seed++); const rows = [];
    for (let d = 42; d >= 1; d--) {
      const date = addDays(today, -d); const wd = date.getDay();
      const wk = (wd === 0 || wd === 6) ? 0.55 : 1; const noise = 0.86 + rnd() * 0.28;
      rows.push({ date: fmtDate(date), clicks: Math.round(c * wk * noise), impressions: Math.round(i * wk * (0.9 + rnd() * 0.2)) });
    }
    m[page] = rows;
  }
  return m;
}

// ---------- knowledge engine
const STOP = new Set(['the', 'and', 'for', 'are', 'what', 'when', 'how', 'who', 'does', 'with', 'that', 'this', 'from', 'our', 'can', 'you', 'all', 'any', 'before', 'after', 'than', 'more', 'have', 'has', 'was', 'were', 'which', 'into', 'about', 'need', 'needs']);

function expandQuery(q) {
  let out = [...tokens(q)];
  const lq = q.toLowerCase();
  for (const g of state.glossary) {
    const all = [g.term, ...g.synonyms].map(x => x.toLowerCase());
    if (all.some(a => lq.includes(a))) out.push(...tokens([g.term, ...g.synonyms].join(' ')));
  }
  return [...new Set(out)];
}
function kbSearch(query, opts = {}) {
  const terms = expandQuery(query); if (!terms.length) return [];
  const hits = [];
  for (const d of state.docs) {
    if (opts.department && d.dept !== opts.department) continue;
    const titleT = tokens(d.title);
    d.chunks.forEach((c, ci) => {
      const headT = tokens(c.heading), bodyT = tokens(c.text);
      let score = 0, matched = [];
      for (const t of terms) {
        const nb = bodyT.filter(x => x === t || x.startsWith(t) && t.length >= 4).length;
        const nh = headT.filter(x => x === t).length, nt = titleT.filter(x => x === t).length;
        const s = nb * 1 + nh * 2.5 + nt * 2;
        if (s) { score += s; matched.push(t); }
      }
      if (score > 0) { score = score * (matched.length / terms.length) / Math.log2(10 + bodyT.length / 40); hits.push({ doc: d, chunk: c, ci, score, matched, coverage: matched.length / terms.length }); }
    });
  }
  hits.sort((a, b) => b.score - a.score);

}
function highlight(text, terms) {
  let out = esc(text);
  for (const t of terms) { if (t.length < 3) continue; out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*)', 'gi'), '<mark>$1</mark>'); }
  return out;
}
function composeAnswer(hits) {
  if (!hits.length) return null;
  const top = hits[0];
  const sentences = top.chunk.text.match(/[^.!?]+[.!?]+/g) || [top.chunk.text];
  const scored = sentences.map(s => ({ s, n: tokens(s).filter(t => top.matched.includes(t)).length })).sort((a, b) => b.n - a.n);
  const pick = scored.slice(0, 2).map(x => x.s.trim());
  return { text: pick.join(' '), source: top, confidence: Math.min(0.98, 0.35 + 0.35 * top.coverage + Math.min(0.3, top.score / 10)) };
}

  const paras = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const out = [];
  for (const p of paras) {
    const m = p.match(/^#+\s*(.+)$/m);
    if (p.length <= 700) out.push(p); else { let cur = ''; for (const s of (p.match(/[^.!?]+[.!?]+/g) || [p])) { if ((cur + s).length > 600) { out.push(cur.trim()); cur = ''; } cur += s; } if (cur.trim()) out.push(cur.trim()); }
  }

}
function extractObligations(text) {
  const found = [];
  const re = /(by|before|until|no later than) the (\d{1,2})(st|nd|rd|th)( of (each|every|the following) month)?/gi; let m;
  while ((m = re.exec(text))) found.push({ kind: 'time', detail: `Due on day ${m[2]} of the month`, due: { day_of_month: +m[2] } });
  const re2 = /(\d{1,3}) (business )?days before (expiry|renewal|the deadline|the due date)/gi;
  while ((m = re2.exec(text))) found.push({ kind: 'lead', detail: `Lead time ${m[1]} days before ${m[3]}`, lead: +m[1] });
  const re3 = /(every|each) (monday|tuesday|wednesday|thursday|friday|week|month|quarter)/gi;
  while ((m = re3.exec(text))) found.push({ kind: 'recurring', detail: `Recurring: ${m[0]}` });
  const re4 = /more than (\d+) (days|hours)/gi;
  while ((m = re4.exec(text))) found.push({ kind: 'state', detail: `State threshold: more than ${m[1]} ${m[2]}`, n: +m[1], unit: m[2] });

// ---------- rule engine
function getRule(id) { return state.rules.find(r => r.id === id); }
function evalThreshold(rule, rows, field) {

  rows.forEach((r, i) => {
    const hist = []; for (let k = 1; k <= n; k++) if (i - 7 * k >= 0) hist.push(rows[i - 7 * k][field]);
    let baseline = null, ratio = null, breach = false;
    if (hist.length >= 2) { baseline = median(hist); ratio = baseline > 0 ? r[field] / baseline : null; breach = ratio !== null && ratio < thr && baseline >= minB; }
    run = breach ? run + 1 : 0;
    const fired = run >= need;
    pts.push({ date: r.date, value: r[field], baseline, ratio, breach, fired, first: fired && run === need, thrLine: baseline == null ? null : baseline * thr });

// ---------- policy + tools
function policyDecision(tool, args) {

    if (lvl === 3 || fl) return { allow: 'approve', approver: 'finance_lead', rule: 'policy-payment-reminders', why: lvl === 3 ? 'level 3 is a collection notice' : 'customer is flagged' };
    if (amt < 500 && lvl <= 2) return { allow: 'auto', rule: 'policy-payment-reminders', why: 'amount below 500 and level ≤ 2' };
    return { allow: 'approve', approver: 'finance_lead', rule: 'policy-payment-reminders', why: 'amount 500 or above' };
  }

  }
  if (tool === 'slack.post_message') {
    if (args.channel === '#general') return { allow: 'approve', approver: 'marketing_lead', rule: 'policy-communication', why: 'company-wide channel' };
    return { allow: 'auto', rule: 'policy-communication', why: 'team channel' };
  }
  const t = TOOLS.find(x => x.name === tool);
  if (t && t.cls === 'write' && t.risk === 'high') return { allow: 'approve', approver: 'finance_lead', rule: 'default', why: 'high-risk write without a specific policy' };

}

  const sc = state.scenario;

    const when = dayStr(-(sc.days + 1)) + ' 10:05';
    if (sc.cause === 'noindex') return { changes: [{ field: 'robots', before: 'index,follow', after: 'noindex,follow', at: when }], summary: 'robots meta changed to noindex' };
    if (sc.cause === 'title') return { changes: [{ field: 'title', before: 'Pricing – plans for every team size | Example', after: 'Example', at: when }, { field: 'meta_description', before: 'Compare plans…', after: '', at: when }], summary: 'title shortened to brand only, meta description removed' };

function callTool(name, args, actor, opts = {}) {

// ---------- scenario + agent trace
function applyScenario() {
  const sc = state.scenario;
  if (sc.applied) resetScenario(true);
  const rows = state.metrics[sc.page]; const n = Math.min(+sc.days, rows.length);
  const f = 1 - (+sc.drop) / 100;
  for (let i = rows.length - n; i < rows.length; i++) {
    rows[i].clicks = Math.round(rows[i].clicks * f);
    if (sc.cause !== 'title') rows[i].impressions = Math.round(rows[i].impressions * (sc.cause === 'server' ? f : f * 1.1));
  }
  if (sc.cause === 'noindex' || sc.cause === 'title') state.deploys.unshift({ system: 'cms', at: dayStr(-(n + 1)) + ' 10:05', by: 'k.nagy', note: sc.cause === 'noindex' ? 'Pricing page template update (staging flag left on)' : 'New pricing page title test', scenario: true });
  sc.applied = true;
  addEvent('test', 'Scenario applied', `${sc.page}: clicks −${sc.drop} % for ${n} days (cause: ${sc.cause})`);
  const res = evaluateRules(state.rules.filter(r => r.type === 'threshold').map(r => r.id), 'daily-seo-collect (test run)');
  state.lastEval = res;
  const task = state.tasks.find(t => t.page === sc.page && t.status !== 'done' && t.type === 'threshold');
  if (task && !task.trace) buildTrace(task);
  return { res, task };
}
function resetScenario(silent) {

  state.tasks = state.tasks.filter(t => !((t.type === 'threshold' || t.type === 'pattern') && t.status !== 'done'));
  state.approvals = state.approvals.filter(a => !a.taskId || state.tasks.some(t => t.id === a.taskId));

}
function buildTrace(task) {
  const rule = getRule(task.ruleId); const page = task.page; const rows = state.metrics[page];
  const thr = rule.type === 'threshold' ? rule : getRule('seo-organic-drop') || state.rules.find(r => r.type === 'threshold');
  const ev = evalThreshold(thr, rows, 'clicks'); const last = ev.points[ev.points.length - 1];
  const evI = evalThreshold({ ...thr, condition: { ...thr.condition, min_baseline: 0 } }, rows, 'impressions'); const lastI = evI.points[evI.points.length - 1];
  const impDown = lastI.ratio != null && lastI.ratio < 0.8;

  const steps = []; const actor = 'agent:monitoring';
  const diff = runTool('crawler.diff_page', { url: page, since_days: 7 });
  const up = runTool('uptime.status', { days: 7 });
  const dep = runTool('deploy.list_recent', { system: 'cms', days: 7 });
  const kb = kbSearch('page owner CMS release process pre-publish checklist')[0];
  steps.push({ call: `metrics.query(signal=search_console.impressions, page=${page}, days=35)`, res: `Impressions at ${pct(lastI.ratio)} of baseline`, note: impDown ? 'Impressions fell as well: a ranking or indexing problem, not a snippet problem.' : 'Impressions are flat: clicks fell alone, so the snippet (title or meta) or a SERP feature changed.' });

  steps.push({ call: `crawler.diff_page(url=${page}, since_days=7)`, res: diff.summary, note: diff.changes.length ? diff.changes.map(c => `${c.field}: "${c.before}" → "${c.after}" at ${c.at}`).join('; ') : 'No change to title, meta, robots, canonical or H1.' });
  steps.push({ call: `deploy.list_recent(system=cms, days=7)`, res: dep.deployments.length ? dep.deployments.map(d => `${d.at} by ${d.by}: ${d.note}`).join(' · ') : 'No CMS deployment in the window', note: dep.deployments.some(d => d.scenario) ? 'A deployment landed the day before the drop began.' : 'No deployment correlates with the drop.' });
  if (kb) steps.push({ call: `kb.search("page owner CMS release process")`, res: `${kb.doc.title} › ${kb.chunk.heading}`, note: 'Owner and the pre-publish checklist come from the knowledge base, not from the prompt.' });

    noindex: ['A robots noindex tag was added to the page by the CMS deployment (high confidence)', 'Ranking loss after a content change (low)', 'Algorithm update (low, drop is page-specific)'],
    title: ['Title and meta description were replaced by the CMS deployment; impressions are unchanged, CTR collapsed (high confidence)', 'A competitor won a SERP feature for the main query (low)'],
    server: ['The server returns 503 for about a quarter of requests; Googlebot drops pages that fail repeatedly (high confidence)', 'Core Web Vitals regression (low)'],

  }[cause];
  const owner = PEOPLE.find(p => p.role === rule.owner_role);
  const alert = `*${task.title}*\n${rule.type === 'pattern' ? `Detected from the crawl diff ${task.detectedBy || 'seconds after the CMS publish'}; traffic is still at ${pct(last.ratio)} of baseline, so nothing has been lost yet.` : `Clicks ${last.value}/day vs usual ${Math.round(last.baseline)} (${pct(last.ratio)}), ${thr.condition.consecutive}+ days.`}\nLikely causes:\n${causes.map((c, i) => `${i + 1}. ${c}`).join('\n')}\nRecommended: ${cause === 'noindex' ? 'remove the noindex tag (approval card sent)' : cause === 'title' ? 'restore the previous title and meta (approval card sent)' : cause === 'server' ? 'IT to investigate the 503s; ticket created' : 'monitor for 3 more days; ticket created for a manual review'}.\nRule: ${rule.id} · Task: ${task.id}`;
  steps.push({ call: `slack.post_message(channel=${owner ? owner.channel : '#marketing'})`, res: 'Alert posted (policy: auto, owner channel)', note: `Owner: ${owner ? owner.name : rule.owner_role}.`, act: true });
  let action = null;
  if (cause === 'noindex') action = callTool('cms.remove_noindex', { path: page, dry_run: false }, actor, { taskId: task.id });
  else if (cause === 'title') action = callTool('cms.set_page_meta', { path: page, title: 'Pricing – plans for every team size | Example', dry_run: false }, actor, { taskId: task.id });
  else action = callTool('ticketing.create_issue', { project: cause === 'server' ? 'ITOPS' : 'WEB', summary: `${cause === 'server' ? 'Investigate 503 errors affecting' : 'Review organic drop on'} ${page}` }, actor, { taskId: task.id });
  if (action.approval) steps.push({ call: `${action.approval.tool}(${Object.entries(action.approval.args).map(([k, v]) => k + '=' + v).join(', ')})`, res: `Dry run ok → approval requested from ${action.approval.approver}`, note: `Policy ${action.decision.rule}: ${action.decision.why}.`, act: true });

  task.trace = { steps, alert, causes, approvalId: action.approval ? action.approval.id : null, ticket: action.result ? action.result.key : null, builtAt: nowStr() };

  return task.trace;
}

// ---------- assistant chat
function chatAnswer(q) {
  const lq = q.toLowerCase();
  if (/deadline|due|overdue|upcoming|határid/.test(lq)) {
    const items = state.rules.filter(r => r.type === 'time' && r.status === 'active').map(r => ({ r, ts: timeStatus(r) })).sort((a, b) => a.ts.daysLeft - b.ts.daysLeft);
    return `<b>Deadlines in the next 60 days</b><ul style="margin:6px 0 0 16px;padding:0">${items.filter(x => x.ts.daysLeft <= 60).map(x => `<li>${esc(x.r.description.replace(/\.$/, ''))} – <b>${x.ts.due}</b> (${x.ts.daysLeft < 0 ? Math.abs(x.ts.daysLeft) + ' days overdue' : 'in ' + x.ts.daysLeft + ' days'}), owner ${esc(personName(x.r.owner_role))}</li>`).join('')}</ul><div class="src">Source: entity store › deadlines (time rules)</div>`;
  }
  if (/who (owns|is responsible|handles)|owner of/.test(lq)) {
    const hits = kbSearch(q); const ans = composeAnswer(hits);
    const role = PEOPLE.find(p => lq.includes(p.team.toLowerCase().split(' ')[0]) || lq.includes(p.role.replace('_', ' ')));
    return (ans ? `${esc(ans.text)}<div class="src">Source: ${esc(ans.source.doc.title)} › ${esc(ans.source.chunk.heading)}</div>` : '') + (role ? `<div class="src">Entity store: ${esc(role.role)} = ${esc(role.name)} (${esc(role.channel)})</div>` : '');
  }
  if (/(run|simulate|check|test).*(seo|scenario|drop)/.test(lq)) {
    const { task } = applyScenario();
    return task ? `Scenario applied and rules evaluated. <b>${esc(getRule(task.ruleId).id)}</b> fired for ${esc(task.page)}; I ran the ${esc(getRule(task.ruleId).playbook)} playbook. Open the <b>Test lab › Scenario</b> tab for the trace.` : 'Scenario applied, but no active rule fired. Increase the drop or the number of days.';
  }
  if (/open tasks|what.*(pending|waiting)|approvals?/.test(lq)) {
    const open = state.tasks.filter(t => t.status !== 'done'), ap = state.approvals.filter(a => a.status === 'pending');
    return `${open.length} open task(s) and ${ap.length} pending approval(s).<ul style="margin:6px 0 0 16px;padding:0">${open.slice(0, 5).map(t => `<li>${esc(t.title)} · ${esc(personName(t.owner))}</li>`).join('')}</ul>`;
  }
  const hits = kbSearch(q); const ans = composeAnswer(hits);
  if (!ans || ans.confidence < 0.58) {
    if (!state.gaps.some(g => g.q === q)) state.gaps.unshift({ q, asked: 1, by: 'console user', at: TODAY });
    return `I could not find this in the knowledge base. I logged the question as a gap for the document owners.${hits.length ? `<div class="src">Nearest documents: ${hits.slice(0, 2).map(h => esc(h.doc.title)).join(', ')}</div>` : ''}`;
  }
  return `${esc(ans.text)}<div class="src">Source: ${esc(ans.source.doc.title)} › ${esc(ans.source.chunk.heading)} · updated ${ans.source.doc.updated}${daysSince(ans.source.doc.updated) > ans.source.doc.reviewEvery ? ' · <span style="color:var(--warn)">past review date</span>' : ''}</div>`;
}

const json = o => `<pre class="yaml">${esc(JSON.stringify(o, null, 2))}</pre>`;
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (const k of ks.slice(0, -1)) { if (o[k] == null) o[k] = {}; o = o[k]; } o[ks[ks.length - 1]] = val; }

function chartSVG(points, label) {
  const w = 680, h = 210, pl = 44, pr = 12, pt = 12, pb = 26;
  const vals = points.flatMap(p => [p.value, p.baseline || 0]); const max = (Math.max(...vals) || 1) * 1.12;
  const x = i => pl + (i / Math.max(1, points.length - 1)) * (w - pl - pr); const y = v => pt + (1 - v / max) * (h - pt - pb);
  const path = key => points.map((p, i) => p[key] == null ? null : `${i === 0 || points[i - 1][key] == null ? 'M' : 'L'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).filter(Boolean).join(' ');
  const area = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ') + ` L${x(points.length - 1).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const ticks = [0, 0.5, 1].map(f => { const v = max * f / 1.12; return `<line x1="${pl}" x2="${w - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}</text>`; }).join('');
  const xl = points.map((p, i) => i % 7 === points.length % 7 - 1 || i === points.length - 1 ? `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${p.date.slice(5)}</text>` : '').join('');
  const marks = points.map((p, i) => p.breach ? `<circle cx="${x(i)}" cy="${y(p.value)}" r="${p.first ? 5 : 3.5}" fill="${p.fired ? 'var(--crit)' : 'var(--warn)'}" stroke="var(--panel)" stroke-width="1.5"><title>${p.date}: ${p.value} vs baseline ${Math.round(p.baseline)} (${pct(p.ratio)})</title></circle>` : '').join('');
  const end = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">
    ${ticks}
    <path d="${area}" fill="var(--accent-soft)" opacity=".55"/>
    <path d="${path('thrLine')}" fill="none" stroke="var(--crit)" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${path('baseline')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
    <path d="${path('value')}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${marks}
    <circle cx="${x(points.length - 1)}" cy="${y(end.value)}" r="3" fill="var(--accent)"/>
    ${xl}
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>signal</span><span><i style="background:var(--muted)"></i>same-weekday median baseline</span><span><i style="background:var(--crit);height:1px"></i>threshold</span><span><i style="background:var(--warn);height:8px;width:8px;border-radius:50%"></i>breach</span><span><i style="background:var(--crit);height:8px;width:8px;border-radius:50%"></i>rule fired</span></div>`;
}

      <div class="panel"><div class="ph"><h2>What happened</h2>${last ? `<span class="hint">correlation ${esc(last.correlation.slice(-8))} · ${chain.length} event(s) in the chain</span>` : ''}</div><div class="pb">${last ? `<div class="trace">${chain.map((e, i) => `<div class="step"><span class="n ${e.status === 'dead-lettered' ? 'act' : 'ok'}">${i + 1}</span><div><div class="call">${esc(e.type)} <span class="hint">${esc(e.subject)} · +${e.latency} ms · by ${esc(e.actor)}</span></div>${e.consumers.map(c => `<div class="res">${evPill(c)} <span class="small">${esc(c.note)}</span></div>`).join('')}</div></div>`).join('')}</div>
        ${(() => { const tk = state.tasks.find(x => chain.some(e => e.type === 'task.created' && e.data.task_id === x.id)); return tk ? `<div class="row" style="margin-top:10px"><span class="pill crit">task ${esc(tk.id)}</span><span class="small">${esc(tk.title)}</span>${tk.page ? `<button class="btn sm" data-action="open-task" data-id="${tk.id}">Open agent run</button>` : ''}</div>` : ''; })()}
        ${state.approvals.some(a => a.status === 'pending' && chain.some(e => e.type === 'approval.requested' && e.data.approval_id === a.id)) ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-action="nav" data-view="approvals">An approval is waiting</button></div>` : ''}` : `<div class="hint">Try the default: <code>cms.page.published</code> with <code>robots: noindex,follow</code> on <code>/pricing</code>. The crawler re-crawls, publishes <code>crawl.page.changed</code>, the pattern rule fires, the orchestrator runs the playbook and asks for approval. Then publish it again with the same idempotency key to see the duplicate dropped.</div>`}</div></div></div>`;
  }
  if (t === 'catalogue') {
    const count = type => bus.stream.filter(e => e.type === type).length;
    return head + `<div class="panel"><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Type</th><th>Tier</th><th>Producer</th><th>Key (ordering)</th><th>Retention</th><th>Consumers</th><th>Seen</th></tr></thead><tbody>
      ${TOPICS.map(x => `<tr><td class="mono"><b>${esc(x.type)}</b></td><td><span class="pill flat ${x.tier === 'domain' ? 'acc' : x.tier === 'timer' ? 'info' : x.tier === 'derived' ? 'warn' : ''}">${esc(x.tier)}</span></td><td class="small">${esc(x.producer)}</td><td class="mono small">${esc(x.key)}</td><td class="nowrap">${esc(x.retention)}</td><td class="small">${x.consumers.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</td><td class="num">${count(x.type)}</td></tr>`).join('')}
    </tbody></table></div></div></div>
    <div class="hint">Naming: <code>domain.entity.past-tense</code>. Schemas are JSON Schema files in git; producers validate on publish. Domain events are facts from company systems, timer events come from the timer service, derived events are rule-engine conclusions, operational events are what the assistant itself did.</div>`;
  }
  if (t === 'subscriptions') {
    const stats = c => { const mine = bus.stream.flatMap(e => e.consumers.filter(x => x.consumer === c)); return { n: mine.length, failed: mine.filter(x => x.result === 'failed').length }; };
    return head + `<div class="panel"><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Consumer</th><th>Subscribed subjects</th><th>Role</th><th>Delivery</th><th>Processed</th></tr></thead><tbody>
      ${SUBSCRIPTIONS.map(s => { const st = stats(s.consumer); return `<tr><td class="mono"><b>${esc(s.consumer)}</b><br>${s.durable ? '<span class="pill ok">durable</span>' : ''}</td><td class="small">${s.filters.map(f => `<code>${esc(f)}</code>`).join(' ')}</td><td class="small">${esc(s.role)}</td><td class="small nowrap">ack ${esc(s.ack)}<br>max deliver ${s.maxDeliver} → DLQ</td><td class="num">${st.n}${st.failed ? `<br><span class="pill crit">${st.failed} failed</span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div></div>
    <div class="hint">Every consumer is a durable pull subscription with explicit acks, an idempotency table and per-key ordering. A consumer that is down simply resumes from its stored position; nothing is lost while it is away.</div>`;
  }
  if (t === 'producers') {
    const T = state.triggers;
    return head + `<div class="stack">
      <div class="panel"><div class="ph"><h2>Timer service · armed timers</h2><span class="hint">durable timers created by events; each fires as an event</span></div><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Fires at</th><th>Emits</th><th>Key</th><th>Why</th><th></th></tr></thead><tbody>
        ${bus.timers.map(x => `<tr><td class="nowrap mono">${esc(x.fireAt)}</td><td class="mono small">${esc(x.type)}</td><td class="mono small">${esc(x.key)}</td><td class="small">${esc(x.reason)}</td><td><button class="btn sm" data-action="fire-timer" data-id="${x.id}">Fire now</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">No timers armed.</td></tr>'}
      </tbody></table></div></div></div>
      <div class="grid2">
      <div class="panel"><div class="ph"><h2>Webhook ingress</h2><span class="hint">signed deliveries, deduplicated, normalised, published</span></div><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Source</th><th>Endpoint</th><th>Publishes</th><th>Last</th><th></th></tr></thead><tbody>
        ${T.webhooks.map(w => `<tr><td>${esc(w.source)}</td><td class="mono small">${esc(w.path)}</td><td class="mono small">${esc(w.event)}</td><td class="nowrap mono small">${esc(w.last)}</td><td><button class="btn sm" data-action="test-webhook" data-id="${w.id}">Send test</button></td></tr>`).join('')}
      </tbody></table></div></div></div>
      <div class="panel"><div class="ph"><h2>Outbox and CDC connectors</h2><span class="hint">in-house systems</span></div><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>System</th><th>Mechanism</th><th>Publishes</th><th>Lag</th><th></th></tr></thead><tbody>
        <tr><td>ERP</td><td class="small">transactional outbox → relay</td><td class="mono small">erp.invoice.*</td><td class="num">0.4 s</td><td><button class="btn sm" data-action="nav" data-view="events" data-evtab="publish" data-pubtype="erp.invoice.posted">Emit</button></td></tr>
        <tr><td>ERP orders table</td><td class="small">CDC (Debezium) → translator</td><td class="mono small">erp.order.status_changed</td><td class="num">1.1 s</td><td><button class="btn sm" data-action="nav" data-view="events" data-evtab="publish" data-pubtype="erp.order.status_changed">Emit</button></td></tr>
        <tr><td>CMS</td><td class="small">transactional outbox → relay</td><td class="mono small">cms.page.published</td><td class="num">0.3 s</td><td><button class="btn sm" data-action="nav" data-view="events" data-evtab="publish" data-pubtype="cms.page.published">Emit</button></td></tr>
      </tbody></table></div></div></div></div>
      <div class="panel"><div class="ph"><h2>Collectors and reconciliation (the periodic remainder)</h2><span class="hint">sources without push, and correctness sweeps that publish only differences</span></div><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Job</th><th>Triggered by</th><th>Publishes</th><th>Last run</th><th></th></tr></thead><tbody>
        <tr><td><b>Search Console collector</b></td><td class="mono small">day.closed</td><td class="mono small">seo.metric.collected (changes only)</td><td class="nowrap mono small">${esc(T.schedules[0].lastRun)}</td><td><button class="btn sm" data-action="emit-day-closed">Emit day.closed</button></td></tr>
        <tr><td><b>Full key-page crawl</b></td><td class="small">daily 07:30 (reconciliation)</td><td class="mono small">crawl.page.changed</td><td class="nowrap mono small">${esc(T.schedules[1].lastRun)}</td><td><button class="btn sm" data-action="run-schedule" data-id="daily-page-diff">Run</button></td></tr>
        <tr><td><b>Deadline reconciliation</b></td><td class="small">weekdays 08:00; compares entity store with armed timers</td><td class="mono small">deadline.reminder.due (missed ones)</td><td class="nowrap mono small">${esc(T.schedules[2].lastRun)}</td><td><button class="btn sm" data-action="run-schedule" data-id="deadline-sweep">Run</button></td></tr>
        <tr><td><b>Knowledge source reconciliation</b></td><td class="small">nightly 02:00 full listing diff</td><td class="mono small">kb.document.changed</td><td class="nowrap mono small">${esc(T.schedules[3].lastRun)}</td><td><button class="btn sm" data-action="run-schedule" data-id="kb-reconcile">Run</button></td></tr>
      </tbody></table></div></div></div></div>`;
  }
  return head + `<div class="panel"><div class="ph"><h2>Dead-letter queue</h2><span class="hint">events a consumer failed to process after 5 deliveries; nothing is dropped silently</span></div><div class="pb tight">${bus.dlq.length ? `<div class="tw"><table class="tbl"><thead><tr><th>When</th><th>Event</th><th>Consumer</th><th>Error</th><th>Attempts</th><th></th></tr></thead><tbody>
    ${bus.dlq.map(x => `<tr><td class="nowrap mono small">${esc(x.at.slice(11))}</td><td class="mono"><b>${esc(x.type)}</b><br><span class="hint">${esc(x.subject)} · #${x.seq}</span></td><td class="mono small">${esc(x.consumer)}</td><td class="small">${esc(x.error)}</td><td class="num">${x.attempts}</td><td>${x.replayed ? '<span class="pill ok">replayed</span>' : `<button class="btn sm primary" data-action="replay-dlq" data-id="${x.id}">Replay</button>`}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">Empty. Tick "make the rule engine crash on the next event" in the stream view and publish something to see one arrive.</div>'}</div></div>
  <div class="hint">Target: the queue is empty at the end of every business day. A growing queue pages the owner of the consumer; a replay re-delivers the original event with the same idempotency key, so consumers that did succeed skip it.</div>`;
}

function viewTools() {
  const t = TOOLS.find(x => x.name === state.ui.toolName) || TOOLS[0]; const res = state.toolResult && state.toolResult.tool === t.name ? state.toolResult : null;
  const input = p => { const id = `tp-${p.n}`; if (p.t === 'select') return `<select id="${id}" name="${p.n}">${p.opts.map(o => `<option value="${esc(o)}">${esc(o || '(any)')}</option>`).join('')}</select>`; if (p.t === 'bool') return `<select id="${id}" name="${p.n}"><option value="true" ${p.d === true ? 'selected' : ''}>true</option><option value="false" ${p.d === false ? 'selected' : ''}>false</option></select>`; return `<input id="${id}" name="${p.n}" type="${p.t === 'number' ? 'number' : 'text'}" value="${esc(p.d ?? '')}" ${p.req ? 'required' : ''}>`; };
  return `<div class="page-h"><div><h1>Tools</h1><p>The only way the assistant touches company systems. One MCP server per system, a few business-level functions each. Every call passes schema validation, the policy rules and the audit log.</p></div></div>
  <div class="split">
    <div class="panel"><div class="pb tight"><div class="tw"><table class="tbl"><thead><tr><th>Tool</th><th>Class</th><th>Risk</th><th>Health</th></tr></thead><tbody>
      ${TOOLS.map(x => `<tr class="click ${x.name === t.name ? 'sel' : ''}" data-action="open-tool" data-name="${x.name}"><td><b class="mono">${esc(x.name)}</b><br><span class="hint">${esc(x.server)}</span></td><td><span class="tag">${esc(x.cls)}</span></td><td>${x.risk === 'high' ? '<span class="pill crit">high</span>' : x.risk === 'medium' ? '<span class="pill warn">medium</span>' : '<span class="pill">low</span>'}</td><td>${statusPill(x.health)}<br><span class="hint">${esc(x.last)}</span></td></tr>`).join('')}
    </tbody></table></div></div></div>
    <div class="panel"><div class="ph"><div><h2 class="mono">${esc(t.name)}</h2><span class="hint">${esc(t.server)} · ${esc(t.cls)} · risk ${esc(t.risk)}</span></div></div><div class="pb stack">
      <p class="small">${esc(t.desc)}</p>
      <form data-form="tool-run" data-tool="${t.name}" class="stack"><div class="form">${t.params.map(p => `<div class="field"><label for="tp-${p.n}">${esc(p.n)}${p.req ? ' *' : ''}</label>${input(p)}</div>`).join('')}</div>
        <div class="row"><button class="btn" type="submit" name="mode" value="dry">Run as dry run</button><button class="btn primary" type="submit" name="mode" value="live">Run ${t.cls === 'write' || t.cls === 'communicate' ? 'live (through policy)' : ''}</button><span class="hint">Policy is evaluated before every call. A live write that needs approval produces an approval card instead of executing.</span></div></form>
      ${res ? `<div class="msg"><div class="from">Decision</div>${res.decision.allow === 'auto' ? '<span class="pill ok">auto</span>' : res.decision.allow === 'approve' ? '<span class="pill warn">approval required</span>' : '<span class="pill crit">forbidden</span>'} <span class="small">${esc(res.decision.rule)}: ${esc(res.decision.why)}</span>${res.approval ? `<div class="small" style="margin-top:6px">Approval <code>${res.approval.id}</code> sent to ${esc(personName(res.approval.approver))}. <a href="#approvals" data-action="nav" data-view="approvals">Open approvals</a></div>` : ''}</div>
        ${res.result || res.dry ? `<div><div class="hint" style="margin-bottom:4px">${res.dry ? 'Dry-run result' : 'Result'} · ${res.ms} ms · logged to audit</div>${json(res.result || res.dry)}</div>` : ''}` : ''}
      <details><summary class="small" style="cursor:pointer">Tool spec (what the model reads)</summary><pre class="yaml">${esc(toYaml({ name: t.name, server: t.server, class: t.cls, risk: t.risk, description: t.desc, input_schema: Object.fromEntries(t.params.map(p => [p.n, { type: p.t === 'bool' ? 'boolean' : p.t === 'number' ? 'integer' : 'string', required: !!p.req, enum: p.opts, default: p.d }])), auth: { mode: 'service_account', credential_ref: 'vault://' + t.server }, observability: { log_arguments: true } }))}</pre></details>
    </div></div></div>`;
}

function viewPlaybooks() {
  const p = PLAYBOOKS.find(x => x.id === state.ui.playbookId) || PLAYBOOKS[0];
  return `<div class="page-h"><div><h1>Playbooks</h1><p>Versioned procedures the agent follows for known tasks. They say which tools may be used, where a human decides, and what "done" means. They are the procedural memory of the assistant.</p></div></div>
  <div class="split"><div class="panel"><div class="pb tight"><div class="list">${PLAYBOOKS.map(x => `<div class="item ${x.id === p.id ? 'sel' : ''}" data-action="open-playbook" data-id="${x.id}"><span class="stripe"></span><div><b>${esc(x.title)}</b><span class="meta">${esc(x.id)} · owner ${esc(x.owner)} · autonomy level ${x.autonomy}</span></div><div></div></div>`).join('')}</div></div></div>
  <div class="panel"><div class="ph"><div><h2>${esc(p.title)}</h2><span class="hint">triggered by ${p.triggeredBy.map(x => `<code>${esc(x)}</code>`).join(', ')}</span></div><button class="btn sm" data-action="nav" data-view="lab">Run in test lab</button></div><div class="pb stack">
    ${kv({ 'autonomy level': `${p.autonomy} – ${['observe', 'suggest', 'execute after approval', 'auto with report', 'auto'][p.autonomy]}`, 'done when': esc(p.done) })}
    <h3>Steps</h3><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${p.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <div class="hint">Promotion to the next autonomy level needs 20 approvals without correction in 30 days; any correction demotes the pair (playbook, tool) one level automatically.</div>
  </div></div></div>`;
}

function viewLab() {
  const t = state.ui.labTab; const sc = state.scenario;
  const head = `<div class="page-h"><div><h1>Test lab</h1><p>Exercise the whole chain without touching real systems: inject a signal, watch the rules fire, read the agent's trace, approve or reject its proposal, and check the knowledge base against the golden question set.</p></div></div>
  ${tabs([['scenario', 'Scenario runner'], ['chat', 'Talk to the assistant'], ['evals', 'Golden questions']], t, 'lab-tab')}`;
  if (t === 'scenario') {
    const isSeo = x => x.page === sc.page && (x.type === 'threshold' || x.type === 'pattern');
    const task = state.tasks.find(x => isSeo(x) && x.status !== 'done') || state.tasks.find(x => isSeo(x) && x.trace);
    const rule = getRule('seo-organic-drop'); const ev = evalThreshold(rule, state.metrics[sc.page], 'clicks');
    const ap = task && task.trace && task.trace.approvalId ? state.approvals.find(a => a.id === task.trace.approvalId) : null;
    return head + `<div class="grid2">
      <div class="panel"><div class="ph"><h2>1 · Inject a signal</h2>${sc.applied ? '<span class="pill warn">scenario active</span>' : '<span class="pill">baseline data</span>'}</div><div class="pb"><form data-form="scenario" class="form">
        <div class="field"><label for="sc-page">Key page</label><select id="sc-page" name="page">${KEY_PAGES.map(p => `<option ${p === sc.page ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label for="sc-cause">Hidden cause (what the agent should find)</label><select id="sc-cause" name="cause">${[['noindex', 'noindex tag added by a CMS deployment'], ['title', 'title and meta replaced (CTR drop)'], ['server', 'server returns 503 errors'], ['unknown', 'nothing on our side (algorithm / seasonality)']].map(([k, l]) => `<option value="${k}" ${k === sc.cause ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label for="sc-drop">Drop in clicks: <output id="sc-drop-out">${sc.drop}</output> %</label><div class="range"><input id="sc-drop" name="drop" type="range" min="5" max="90" step="5" value="${sc.drop}" data-input="range-out" data-out="sc-drop-out"></div></div>
        <div class="field"><label for="sc-days">Days it has lasted</label><input id="sc-days" name="days" type="number" min="1" max="10" value="${sc.days}"></div>
        <div class="field wide row"><button class="btn primary" type="submit">Apply scenario and run the daily collection</button><button class="btn" type="button" data-action="reset-scenario">Reset metrics</button></div></form>
        <div class="msg" style="margin-top:12px"><div class="from">Push path (no waiting for traffic to fall)</div><span class="small">The same regression is caught in seconds when the CMS publishes an event: <code>cms.page.published</code> → crawler re-crawls → <code>crawl.page.changed</code> → pattern rule → task.</span><div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-action="nav" data-view="events" data-evtab="publish" data-pubtype="cms.page.published">Publish the CMS event instead</button></div></div></div></div>
      <div class="panel"><div class="ph"><h2>2 · Rule evaluation</h2><span class="hint">seo-organic-drop on ${esc(sc.page)}</span></div><div class="pb stack">
        ${chartSVG(ev.points.slice(-35), 'clicks on ' + sc.page)}
        ${state.lastEval ? `<div class="tw"><table class="tbl"><thead><tr><th>Rule</th><th>Page</th><th>Ratio</th><th>Result</th></tr></thead><tbody>${state.lastEval.filter(x => x.page === sc.page || x.fired).map(x => `<tr><td class="mono small">${esc(x.rule.id)}<br>${statusPill(x.rule.status)}</td><td class="mono small">${esc(x.page)}</td><td class="num">${pct(x.ratio)}</td><td>${x.fired ? (x.rule.status === 'active' ? '<span class="pill crit">fired → task</span>' : '<span class="pill info">would fire (shadow)</span>') : '<span class="pill ok">normal</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="hint">Apply a scenario to evaluate the threshold rules against it. The chart shows the signal, its same-weekday median baseline and the threshold line.</div>'}
      </div></div>
    </div>
    ${task ? `<div class="panel"><div class="ph"><div><h2>3 · Agent run · ${esc(task.id)}</h2><span class="hint">${esc(task.ruleId)} · playbook ${esc(getRule(task.ruleId)?.playbook || rule.playbook)} · ${esc(task.trace ? task.trace.builtAt : '')}</span></div><div class="row">${sevPill(task.severity)}<span class="pill ${task.status === 'done' ? 'ok' : task.status === 'acked' ? 'info' : 'warn'}">${task.status}</span></div></div><div class="pb"><div class="grid2">
      <div class="stack"><h3>Trace</h3><div class="trace">${(task.trace ? task.trace.steps : []).map((s, i) => `<div class="step"><span class="n ${s.act ? 'act' : 'ok'}">${i + 1}</span><div><div class="call">${esc(s.call)}</div><div class="res">${esc(s.res)}</div><div class="note">${esc(s.note)}</div></div></div>`).join('')}</div></div>
      <div class="stack"><h3>Alert the owner receives</h3><div class="msg"><div class="from">Slack · ${esc(PEOPLE.find(p => p.role === task.owner)?.channel || '#marketing')}</div><pre style="font-family:var(--font-ui);font-size:13px">${esc(task.trace ? task.trace.alert : '')}</pre></div>
        <h3>Proposed action</h3>${ap ? approvalCard(ap) : task.trace && task.trace.ticket ? `<div class="msg"><div class="from">Executed (policy: auto)</div>Ticket <b>${esc(task.trace.ticket)}</b> created and linked to the task.</div>` : ''}
        <div class="row">${task.status === 'open' ? `<button class="btn" data-action="ack-task" data-id="${task.id}">Acknowledge task</button>` : ''}<button class="btn" data-action="nav" data-view="approvals">Open audit log</button></div></div>
    </div></div></div>` : ''}`;
  }
  if (t === 'chat') return head + `<div class="panel"><div class="chat" id="chat">${state.chat.map(m => `<div class="bub ${m.who === 'me' ? 'me' : ''}">${m.who === 'me' ? esc(m.text) : m.html}</div>`).join('')}</div>
    <div style="padding:0 14px 10px" class="chips">${['When is the VAT return due?', 'What deadlines are coming up?', 'Who owns the pricing page?', 'What happens to an order awaiting payment for 10 days?', 'Run the SEO drop scenario', 'What is open or pending?', 'What is the mileage rate?'].map(q => `<button type="button" class="chip" data-action="chat-q" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form data-form="chat" class="chat-in"><input id="chat-in" name="q" placeholder="Ask the assistant…" autocomplete="off"><button class="btn primary" type="submit">Send</button></form></div>
    <div class="hint">The prototype routes questions by intent: deadlines and owners come from the entity store, document questions from the knowledge index with a citation, and "run the scenario" drives the test lab. Unanswerable questions are logged as gaps.</div>`;
  const ev = state.evalRun;

      const tick = () => { state.addResult.stage++; if (state.addResult.stage >= 7) { state.docs.push(doc); const src = state.sources.find(s => s.id === 'manual'); src.lastSync = nowStr(); addEvent('kb', 'Document indexed', `${doc.title} (${doc.chunks.length} chunks, ${doc.extracted.length} obligations found)`); emit('kb.document.changed', { subject: doc.id, key: doc.id, actor: 'user:console', data: { document_id: doc.id, title: doc.title, source: 'manual', chunks: doc.chunks.length }, idem: `kbdoc:${doc.id}` }); audit('console user', 'kb.ingest', `${doc.id}: ${doc.chunks.length} chunks, ACL ${doc.acl.join(',')}`); render(); toast(`${doc.title} is now searchable`); } else { render(); setTimeout(tick, 260); } };
      setTimeout(tick, 200);
    };
    if (file && file.size) { const fr = new FileReader(); fr.onload = () => go(String(fr.result)); fr.readAsText(file); } else go(fd.get('text') || '');
  },
  'kb-source'(fd) { state.sources.push({ id: uid('src'), name: fd.get('name'), kind: fd.get('kind'), docs: 0, lastSync: 'never', status: 'ok', acl: fd.get('acl') }); audit('console user', 'kb.source_added', fd.get('name')); render(); toast('Connector registered. First sync runs at 02:00.'); },
  'kb-glossary'(fd) { state.glossary.push({ term: fd.get('term'), meaning: fd.get('meaning'), synonyms: String(fd.get('synonyms') || '').split(',').map(s => s.trim()).filter(Boolean) }); audit('console user', 'kb.glossary_added', fd.get('term')); render(); toast('Term added; retrieval now expands it'); },
  'add-schedule'(fd, form) { const rules = [...form.querySelector('[name=rules]').selectedOptions].map(o => o.value); state.triggers.schedules.push({ id: uid('sch'), name: fd.get('name'), cron: fd.get('cron'), human: 'custom', runs: [], rules, lastRun: 'never', next: 'next match', status: 'ok' }); audit('console user', 'schedule.created', `${fd.get('name')} (${fd.get('cron')})`); render(); toast('Schedule created'); },
  'tool-run'(fd, form, submitter) {
    const name = form.dataset.tool; const t = TOOLS.find(x => x.name === name); const args = {};
    for (const p of t.params) { let v = fd.get(p.n); if (p.t === 'number') v = v === '' ? undefined : +v; else if (p.t === 'bool') v = v === 'true'; args[p.n] = v; }
    const mode = submitter && submitter.value === 'dry' ? 'dry' : 'live';
    if ('dry_run' in args) args.dry_run = mode === 'dry' ? true : args.dry_run;
    const t0 = performance.now(); let out;
    if (mode === 'dry' && !('dry_run' in args)) { out = { decision: policyDecision(name, args), result: runTool(name, args) }; audit('console user', 'tool.dry_run', `${name} ${JSON.stringify(args)} (read-only preview)`); }
    else out = callTool(name, args, 'console user');
    state.toolResult = { tool: name, ...out, ms: Math.max(12, Math.round(performance.now() - t0 + 40 + Math.random() * 120)) }; render();
  },
  'add-edge'(fd) { const f = state.flows.list.find(x => x.id === state.ui.flowId); const from = fd.get('from'), to = fd.get('to'), label = fd.get('label') || ''; if (from === to || f.edges.some(e => e.from === from && e.to === to && e.label === label)) return; f.edges.push({ from, to, label }); render(); },
  publish(fd) { let data; try { data = JSON.parse(fd.get('data') || '{}'); } catch (e) { toast('Data is not valid JSON: ' + e.message); return; } const type = fd.get('type'); const ev = emit(type, { subject: fd.get('subject'), key: fd.get('subject'), actor: 'user:console', source: 'console', data, idem: fd.get('idem') || undefined }); state.pubResult = { correlation: ev.correlation, id: ev.id }; state.ui.pubType = type; render(); toast(ev.status === 'duplicate' ? 'Duplicate: dropped by the idempotency check' : ev.status === 'dead-lettered' ? 'Published; one consumer failed and the event went to the dead-letter queue' : `Published; ${ev.consumers.length} consumer(s) processed it in ${ev.latency} ms`); },
  scenario(fd) { state.scenario = { page: fd.get('page'), cause: fd.get('cause'), drop: +fd.get('drop'), days: +fd.get('days'), applied: state.scenario.applied }; const { task } = applyScenario(); render(); toast(task ? `Rule fired; agent trace ready for ${task.page}` : 'No active rule fired with these numbers'); },
  chat(fd, form) { const q = (fd.get('q') || '').trim(); if (!q) return; form.reset(); doChat(q); },
};

// ---------- wiring
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = A[el.dataset.action]; if (fn) fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(new FormData(f), f, e.submitter);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'rule-filter') { state.ui.ruleFilter = el.value; render(); return; }
  if (el.dataset.change === 'add-type') { state.ui.addType = el.value; return; }
  if (el.dataset.nodeField) { const f = state.flows.list.find(x => x.id === state.ui.flowId); const n = f && f.nodes.find(x => x.id === state.ui.selNode); if (!n) return; if (el.dataset.nodeField === 'name') n.name = el.value; else n.p[el.dataset.nodeField] = el.value; audit('console user', 'flow.edited', `${f.id}/${n.id}: ${el.dataset.nodeField}`); render(); return; }
  if (el.dataset.change === 'ev-filter') { state.ui.evFilter = el.value; render(); return; }
  if (el.dataset.change === 'ev-fail') { state.bus.failNext = el.checked; return; }
  if (el.dataset.change === 'pub-type') { state.ui.pubType = el.value; state.pubResult = null; render(); return; }
  if (el.dataset.change === 'sim-page') { if (state.lastRuleSim) state.lastRuleSim.page = el.value; render(); return; }
  if (el.dataset.ruleField) {
    const r = getRule(state.ui.ruleId); if (!r) return;
    let v = el.value; const kind = el.dataset.kind;
    if (kind === 'list') v = v.split(',').map(s => s.trim()).filter(Boolean).map(x => isNaN(+x) || x === '' ? x : +x);
    else if (kind === 'number' || el.type === 'number') v = +v;
    else if (v === 'true' || v === 'false') v = v === 'true';
    setPath(r, el.dataset.ruleField, v);
    if (el.dataset.ruleField === 'entity') r.condition = v === 'orders' ? { days_in_status_gt: 7 } : { hours_open_gt: 4 };
    audit('console user', 'rule.edited', `${r.id}: ${el.dataset.ruleField} = ${Array.isArray(v) ? v.join(',') : v}`);
    if (state.lastRuleSim && state.lastRuleSim.ruleId === r.id) A['simulate-rule']({ id: r.id }); else render();
  }
});
let drag = null;
function svgPoint(svg, e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('#canvas [data-node]'); const edge = e.target.closest && e.target.closest('#canvas [data-edge]');
  if (edge && !g) { state.ui.selEdge = edge.dataset.edge; state.ui.selNode = null; render(); return; }
  if (!g) return; const svg = g.closest('svg'); const f = state.flows.list.find(x => x.id === state.ui.flowId); const n = f && f.nodes.find(x => x.id === g.dataset.node); if (!n) return;
  const p = svgPoint(svg, e); drag = { n, dx: p.x - n.x, dy: p.y - n.y, sx: e.clientX, sy: e.clientY, moved: false, svg }; e.preventDefault();
});
document.addEventListener('pointermove', e => { if (!drag) return; if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true; if (!drag.moved) return; const p = svgPoint(drag.svg, e); drag.n.x = Math.max(0, Math.round(p.x - drag.dx)); drag.n.y = Math.max(0, Math.round(p.y - drag.dy)); const f = state.flows.list.find(x => x.id === state.ui.flowId); const run = state.flows.runs.find(r => r.id === state.ui.selRun) || state.flows.runs.find(r => r.flowId === f.id) || null; const wrap = document.getElementById('canvas-wrap'); if (wrap) { wrap.innerHTML = renderCanvasSVG(f, run); drag.svg = wrap.querySelector('svg'); } });
document.addEventListener('pointerup', e => { if (!drag) return; const d = drag; drag = null; if (!d.moved) { state.ui.selNode = state.ui.selNode === d.n.id ? null : d.n.id; state.ui.selEdge = null; } render(); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset.input === 'range-out') { const o = document.getElementById(el.dataset.out); if (o) o.textContent = el.value; } });

function start() {
  load();
  // metrics are generated relative to today; regenerate when the stored series is stale
  const any = Object.values(state.metrics)[0];
  if (!any || any[any.length - 1].date !== dayStr(-1)) { state.metrics = genMetrics(); state.scenario.applied = false; state.lastEval = null; }
  const h = (location.hash || '').replace('#', ''); if (VIEWS[h]) state.ui.view = h;
  render();
}
start();
</script>
