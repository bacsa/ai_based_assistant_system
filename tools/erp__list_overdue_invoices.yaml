# Tool spec. Schema: schemas/tool.schema.json. One MCP server per system; see docs/05-tool-system.md.
name: erp.list_overdue_invoices
server: mcp-erp
class: read
risk: low
description: Open customer invoices overdue by at least N days.
input_schema:
  type: object
  required: []
  properties:
    min_days:
      type: integer
      default: 7
auth:
  mode: service_account
  credential_ref: vault://mcp-erp
observability:
  log_arguments: true
  mask_fields: []
